<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - TechCon 2024</title>
    <style>
        /* Simple optional styles for making the map responsive */
        .map-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin-top: 1rem;
        }
        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <h1>Contact Us</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main>

        <!-- CONTACT INFORMATION -->
        <section>
            <h2>Get in Touch</h2>

            <p>
                Email us directly at: 
                <a href="mailto:email@example.com">email@example.com</a>
            </p>

            <h3>Follow Us</h3>
            <ul>
                <li><a href="https://twitter.com" target="_blank">Twitter</a></li>
                <li><a href="https://facebook.com" target="_blank">Facebook</a></li>
                <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
            </ul>
        </section>

        <!-- EMBEDDED MAP -->
        <section>
            <h2>Conference Venue</h2>
            <p>Find our exact location below:</p>

            <div class="map-container">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835434509426!2d144.9537353153153!3d-37.81627974201137!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d43f1f02efd%3A0x2bb6d73e5bb5a7b5!2sTechCon%20Conference%20Center!5e0!3m2!1sen!2sus!4v1700000000000"
                    allowfullscreen="" 
                    loading="lazy">
                </iframe>
            </div>
        </section>

        <!-- CONTACT FORM -->
        <section>
            <h2>Contact Us Form</h2>

            <form action="#" method="post">

                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="6" required></textarea><br><br>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2024 TechCon. All rights reserved.</p>
    </footer>

</body>
</html>
